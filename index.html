  provenance:[
    {id:'c1',kind:'Equation',title:'Experiment response function R_{ρ,M,W}(π)',projectId:'p1',workId:'r0',purpose:'Canonical observable-conditioned response object from which Ω_rel is constructed.',expression:'R_{ρ,M,W}(π)(λ) = Tr[M E_{π,λ}(ρ)],   λ ∈ W',inputs:'ρ = prepared density operator, ρ ≥ 0 and Tr(ρ)=1\nM = bounded Hermitian observable\nE_{π,λ} = parameter-dependent CPTP channel for implementation π\nW = declared feature/parameter window\nλ = parameter value in W',steps:'1. Prepare state ρ.\n2. Apply implementation channel E_{π,λ}.\n3. Evaluate observable M on the resulting state.\n4. Repeat over λ ∈ W to obtain the complete response function.\n5. Treat this response function—not the raw implementation word—as the measurable object used by Ω_rel.',output:'A function R_{ρ,M,W}(π): W → ℝ (or the relevant real response space) describing what the declared experiment observes for implementation π.',validation:'Source-backed from “The Ayala Ω Framework — Paper I — Part One,” Mathematical Framework §3. The manuscript states this response definition explicitly.',status:'SOURCE-BACKED · exact published-manuscript equation'},
    {id:'c2',kind:'Equation',title:'Canonical Ω_rel definition',projectId:'p1',workId:'r0',purpose:'Store the exact state-, observable-, and feature-window-conditioned order-fragility definition used throughout the Ω framework.',expression:'Ω_rel(π,σ;ρ,M,W) = || R_{ρ,M,W}(π) − R_{ρ,M,W}(σ) ||_W',inputs:'R_{ρ,M,W}(π), R_{ρ,M,W}(σ) = response functions for two admissible implementations\n||·||_W = chosen norm on the declared response space F(W)\nρ, M, W fixed for the comparison',steps:'1. Compute R_{ρ,M,W}(π).\n2. Compute R_{ρ,M,W}(σ).\n3. Form the pointwise response difference ΔR = R(π) − R(σ).\n4. Evaluate ||ΔR||_W.\n5. Record Ω_rel together with the exact ρ, M, W and norm; changing any of them can change the value/ranking.',output:'Ω_rel ≥ 0. It is a pseudometric on raw implementations and becomes a metric after quotienting by observable equivalence.',validation:'The source manuscript explicitly defines Ω_rel and states nonnegativity, symmetry, triangle inequality, and the observable-equivalence quotient interpretation.',status:'SOURCE-BACKED · canonical Ω mathematics'},
    {id:'c3',kind:'Theorem / bound',title:'Observable-quotient metric and global-channel bound',projectId:'p1',workId:'r0',purpose:'Preserve the mathematical relationship between Ω_rel, observable equivalence, and a global channel-distance bound.',expression:'d_Ω([π],[σ]) = Ω_rel(π,σ;ρ,M,W)\n\nΩ_rel(π,σ) ≤ ||M||_∞ · sup_{λ∈W} || E_{π,λ} − E_{σ,λ} ||_◇',inputs:'[π],[σ] = observable-equivalence classes, where π ~_{ρ,M,W} σ iff their response functions agree\n||M||∞ = operator norm\n||·||◇ = diamond norm',steps:'1. Define π ~ σ when R(π)=R(σ) in F(W).\n2. Form equivalence classes [π].\n3. Define d_Ω using Ω_rel on representatives.\n4. Well-definedness follows because equivalent representatives have identical responses.\n5. Nonnegativity, symmetry and triangle inequality follow from the response-space norm.\n6. For the supremum response norm, apply Hölder duality and the diamond-distance definition to obtain the channel-distance upper bound.',output:'Ω_rel induces a genuine metric on observable-equivalence classes; global channel closeness guarantees response closeness, although the converse need not hold.',validation:'Source-backed from Theorem 4.1 and §4.6 of the Ω Paper I manuscript.',status:'SOURCE-BACKED · theorem lineage'},
    {id:'c4',kind:'Pipeline',title:'H8-A Step 1 — exact bin mapping and covariance construction',projectId:'p2',workId:'r4',purpose:'Record exactly how BABAR and BESIII were placed on a common grid and how the covariance used by the test was assembled.',expression:'b = A x\nC_BABAR,mapped = A C_BABAR Aᵀ\nC_primary = C_BABAR,mapped + C_BESIII,stat + C_BABAR,syst + C_BESIII,norm(0.9%)',inputs:'BABAR: 337 cross-section bins plus 337×337 statistical covariance and documented systematic-correlation instructions.\nBESIII: corrected 60×60 statistical covariance.\nFrozen test domain: 0.600–0.880 GeV = 56 BESIII 5-MeV bins.\nMapping: exact bin-overlap integration, not interpolation.\nBESIII unpublished full systematic covariance: represented in the primary sensitivity model as a fully correlated 0.9% normalization nuisance.',steps:'1. Parse the 337 BABAR cross-section bins.\n2. Build overlap matrix A from exact source-bin/target-bin fractional overlaps.\n3. Verify every target row sums to 1 (archived min=1, max=1).\n4. Map BABAR central values: b=A x.\n5. Propagate BABAR statistical covariance linearly: A C Aᵀ.\n6. Add 10 documented independent BABAR systematic sources (total 0.505% in 0.6–0.9 GeV).\n7. Add BESIII corrected statistical covariance.\n8. Add the 0.9% fully correlated BESIII normalization sensitivity term for the primary model.\n9. Audit symmetry, positive definiteness and conditioning before inversion.',output:'Primary 56×56 combined covariance. Audit: BABAR covariance min eigenvalue 1.1773542359×10⁻⁵; mapped BABAR min eigenvalue 3.5353893865; primary min eigenvalue 31.1545237036; primary condition number 179.983284203.',validation:'Archived H8-A workbook records PASS for 337 parsed bins, covariance dimensions, exact-overlap row sums, positive eigenvalues and condition number.',status:'SOURCE-BACKED · archived H8-A workbook'},
    {id:'c5',kind:'Calculation',title:'H8-A Step 2 — global covariance-aware comparison',projectId:'p2',workId:'r4',purpose:'Preserve the global raw and shape-only comparison before any localized-window scan.',expression:'r(s) = b − s·y\nχ²(s) = r(s)ᵀ C⁻¹ r(s)\nŝ = argmin_s χ²(s)',inputs:'b = BABAR spectrum mapped to the 56-bin BESIII grid\ny = BESIII spectrum\nC = primary combined covariance from H8-A Step 1\ns = fitted global BABAR/BESIII normalization scale',steps:'1. Compute the raw spectrum difference using the primary covariance: raw χ² = 61.4655206249502 for 56 dof.\n2. Convert to raw p = 0.28668691486582804.\n3. Float one common multiplicative normalization s.\n4. Minimize the GLS quadratic form χ²(s).\n5. Obtain ŝ = 1.0235007265364129 (≈2.35% normalization offset).\n6. Recompute the shape-only statistic after fitting s: χ²_shape = 57.748109120415386 for 55 dof.\n7. Convert to p_shape = 0.3740521190133588.',output:'Global shape comparison is not statistically significant: χ²=57.7481091204 / 55 dof, p=0.3740521190.',validation:'Covariance-sensitivity variants remain non-significant: exact-stat-only p=0.37108; BABAR-full+BESIII-stat p=0.37405; BESIII 0.9% diagonal stress p=0.68968.',status:'SOURCE-BACKED · numerical chain preserved'},
    {id:'c6',kind:'Calculation',title:'H8-A Step 3 — 25-MeV local GLS scan + look-elsewhere calibration',projectId:'p2',workId:'r4',purpose:'Preserve the location-agnostic local-shape scan and the multiple-testing correction that leads to the H8-A null adjudication.',expression:'For each 5-bin window w:\nr_w(s_w)=b_w−s_w y_w\nχ²_w=min_{s_w} r_wᵀ C_w⁻¹ r_w\nT=max_w χ²_w\np_LEE = P_null(T_sim ≥ T_obs)',inputs:'52 allowed overlapping 25-MeV windows across 0.600–0.880 GeV.\nFive 5-MeV bins/window.\nOne floated normalization per window → 4 dof.\nPrimary combined covariance.\n50,000 correlated null draws.\nFixed seed: 20260817.',steps:'1. Slide a five-bin (25-MeV) window across every allowed center.\n2. In each window, fit one local normalization s_w.\n3. Compute the four-dof local shape χ².\n4. Record all 52 centers without tuning to H6/H7.\n5. Largest observed local statistic occurs at center 0.7025 GeV, window 0.6900–0.7150 GeV: s=1.0141992322799835, χ²=6.679946064788761, local p=0.15379958841255764.\n6. At the pre-existing ~0.7825-GeV neighborhood: s=1.012042216128071, χ²=6.055134000206542, p=0.1950684944474217; this window ranks 3rd of 52.\n7. Simulate 50,000 correlated null realizations and take the maximum χ² over windows for each draw.\n8. Compare the observed maximum with this max-statistic null distribution.\n9. Look-elsewhere adjusted p = 0.9495610087798244.',output:'H8-A adjudication: NULL / NEGATIVE. No statistically supported localized BABAR–BESIII shape tension; the maximum is at 0.7025 GeV, not the ~0.78-GeV neighborhood.',validation:'The archived workbook freezes the pair, domain, mapping rule, local statistic, simulation count and seed. Covariance stress tests leave the local maximum at 0.7025 GeV.',status:'SOURCE-BACKED · full calculation path + intermediate results'},
    {id:'c7',kind:'Model + calculation',title:'BJT-11 core model and exact Q03 localization checkpoint',projectId:'p3',workId:'r6',purpose:'Preserve the falsification-oriented energy×centrality model and the exact-data Q03 checkpoint used to test localization behavior.',expression:'H₀: O(E,C)=A(E)+B(C)\nH₁: O(E,C)=A(E)+B(C)+I(E,C)\nLocalization diagnostic: preregistered Λ_O(E), discrete E*, plus weighted log-energy center/width.',inputs:'Official STAR HEPData Table 17, DOI 10.17182/hepdata.133992.v1/t17.\nEnergy E and centrality C grid for the Q03 light-nucleus observable.\nExact-data requirement before escalating physics significance.',steps:'1. Ingest official HEPData Table 17.\n2. Fit/evaluate the factorized energy+centrality null O=A+B.\n3. Form the interaction structure represented by I(E,C) under the alternative.\n4. Evaluate the preregistered centrality-sensitive localization contrast Λ_O(E).\n5. Locate the discrete maximum E*.\n6. Compute the weighted log-energy center and log-width.\n7. Repeat support truncations to diagnose high-energy boundary leverage.\n8. Preserve exact-data and uncertainty/covariance limitations before any cross-observable significance claim.',output:'Exact nominal Q03 checkpoint: E*=11.5 GeV; weighted center=19.611 GeV; log-width=0.6858.\nSupport diagnostics:\nAll energies: nominal 19.61; MC median 27.40; 68% interval 22.01–35.51 GeV.\nDrop 200: nominal 19.39; MC 20.76; interval 18.14–24.28.\nDrop 62.4 & 200: nominal 17.78; MC 18.40; interval 16.42–20.65.\n≤27 GeV: nominal 15.36; MC 15.09; interval 13.74–16.52.',validation:'The BJT-11 report explicitly interprets the shift as evidence that uncertainty-heavy high-energy endpoints can pull absolute-residual localization upward, motivating a prospective boundary-robust rule rather than a discovery claim.',status:'SOURCE-BACKED · exact Q03 validation'},
    {id:'c8',kind:'Robustness test',title:'BJT-11Y robustness battery summary',projectId:'p3',workId:'r6',purpose:'Preserve the archived robustness envelope for the overlap statistic under weighting and leave-one-energy-out variants.',expression:'Robustness criterion: evaluate p_overlap across prespecified weighting and leave-one-out variants; retain the full min–max envelope rather than only the most favorable result.',inputs:'BJT-11Y robustness summary CSV.\nWeighting variants and leave-one-energy-out (LOO) variants.',steps:'1. Recompute p_overlap under every weighting variant.\n2. Record the minimum and maximum rather than selecting one.\n3. Recompute p_overlap after each allowed leave-one-energy-out deletion.\n4. Record fraction of LOO variants below 0.05.\n5. Identify the worst and best variants by p_overlap.',output:'Weighting p_overlap range: 0.0015199696006079–0.0430791384172316; all weighting variants <0.05.\nLOO p_overlap range: 0.0003999800009999–0.0411479426028698; fraction <0.05 = 1.0.\nWorst LOO: Q01_drop_7.7, p=0.0411479426028698.\nBest LOO: Q03_drop_14.5, p=0.0003999800009999.',validation:'Values are imported directly from the archived BJT-11Y_robustness_summary.csv. Interpretation remains subject to the BJT-11 report’s caveat that earlier Q01 inputs were figure-reconstructed rather than exact collaboration tables.',status:'SOURCE-BACKED · archived robustness output'},
    {id:'c9',kind:'Calculation lineage',title:'RC2 equal-budget decision comparison — result checkpoint',projectId:'p1',workId:'r0',purpose:'Retain the known RC2 outcome while clearly separating it from source-backed equations that have already been recovered.',expression:'Exact implementation equation/code: NOT YET INGESTED into Atlas v0.4.',inputs:'Equal-budget comparator inputs; nominal-gap strata; Ω activation outputs; permutation-control inputs.',steps:'Known archived result checkpoint only:\n1. Evaluate equal-budget comparator.\n2. Apply Ω selective activation.\n3. Restrict/report the lowest nominal-gap quartile.\n4. Count decisions whose selections changed.\n5. Classify changed decisions as helpful vs harmful.\n6. Compare against the robust baseline and permutation control.\n\nNEXT INGESTION REQUIREMENT: attach the exact RC2 source script/data and replace this checkpoint with symbol-by-symbol equations and executable calculation steps.',output:'Recorded RC2 headline: 21/2400 decisions changed in the lowest nominal-gap quartile; 20 helpful, 1 harmful. Robust baseline changed 71 with near-even split.',validation:'Result lineage is retained, but this card is intentionally NOT marked source-backed until the exact RC2 implementation package is recovered and ingested.',status:'PARTIAL · result known, exact implementation still required'},
    {id:'c10',kind:'Reproducible calculation chain',title:'BJT-1 seven-energy net-Xi reconstruction + diagnostics',projectId:'p7',workId:'r7',purpose:'Connect the frozen BJT-1 source tables and reproduction script to the machine-readable JSON result and final transport-slope finding.',expression:'Fit the corrected participant-normalized net-Xi yield with a weighted log-linear relation versus beam rapidity; alpha_Xi = −slope. Downstream cards test common-slope compatibility, species-order topology, fixed-seed null calibration, and adversarial deformation.',inputs:'BES-I STAR HEPData strange-hadron YAML tables; 62.4- and 200-GeV STAR sources; K−/π− correction sources; frozen BJT-1R/BJT-1X workbooks; Tsang et al. published comparator/model slopes.',steps:'1. Construct net-Xi from Xi− and anti-Xi+ integrated yields.\n2. Aggregate/normalize centrality according to the frozen BJT-1 procedure.\n3. Apply the K−/π− strangeness correction and participant normalization.\n4. Extend the energy ladder from 7.7–39 GeV to 62.4 and 200 GeV.\n5. Fit the weighted log-linear transport relation and set alpha_Xi=−b.\n6. Run BJT-1X robustness variants.\n7. Evaluate BJT-1Y common-slope/model diagnostics.\n8. Evaluate BJT-1Z adjacent-species topology.\n9. Run BJT-1N with 1,000,000 pseudo-experiments/null using PCG64 seed 20260815.\n10. Run BJT-1AN deformation diagnostics.\n11. Write the complete machine-readable summary to BJT-1_v1.0_reproduction_results.json.',output:'JSON checkpoint: alpha_Xi=0.8129415523699661; SE=0.09681213275469905; intercept=0.7785139880675012; chi-square=1.0621025339047616; dof=5; p=0.9574028729219721. Published comparator: 0.86 ± 0.10. The same JSON stores BJT-1Y/Z/N/AN diagnostic summaries.',validation:'The final report states that the compact script independently recalculates the seven-energy Xi fit and the BJT-1Y, BJT-1Z, BJT-1N and BJT-1AN summaries from frozen numerical inputs. Claim ceiling remains bounded: the result is a robust independent reconstruction/checkpoint, not unique proof of baryon-junction transport or a full PYTHIA exclusion.',status:'SOURCE-BACKED · JSON + script + frozen workbooks'}

function openProvenance(id){data.provenance=data.provenance||[];const x=data.provenance.find(c=>c.id===id)||{kind:'Calculation',title:'',projectId:data.projects[0]?.id||'',workId:data.refs[0]?.id||'',purpose:'',expression:'',inputs:'',steps:'',output:'',validation:'',status:'Working'};openModal(id?'Edit math / calculation':'New math / calculation',`<div class="form-grid"><label class="field">Type<select name="kind">${['Equation','Calculation','Pipeline','Robustness test','Derivation','Intermediate result'].map(v=>`<option ${x.kind===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Status<input name="status" value="${esc(x.status||'')}"></label><label class="field full">Title<input name="title" value="${esc(x.title)}" required></label><label class="field">Project<select name="projectId">${data.projects.map(p=>`<option value="${p.id}" ${p.id===x.projectId?'selected':''}>${esc(p.title)}</option>`).join('')}</select></label><label class="field">Linked work<select name="workId">${data.refs.map(r=>`<option value="${r.id}" ${r.id===x.workId?'selected':''}>${esc(r.title)}</option>`).join('')}</select></label><label class="field full">Purpose<textarea name="purpose">${esc(x.purpose||'')}</textarea></label><label class="field full">Equation / mathematical definition<textarea name="expression" class="math-input">${esc(x.expression||'')}</textarea></label><label class="field full">Inputs / data / parameters<textarea name="inputs">${esc(x.inputs||'')}</textarea></label><label class="field full">Calculation / derivation steps<textarea name="steps" class="tall">${esc(x.steps||'')}</textarea></label><label class="field full">Output / intermediate or final result<textarea name="output">${esc(x.output||'')}</textarea></label><label class="field full">Validation / nulls / robustness / reproduction<textarea name="validation">${esc(x.validation||'')}</textarea></label></div>`,fd=>{const obj={id:id||'c'+Date.now(),kind:fd.get('kind'),title:fd.get('title'),projectId:fd.get('projectId'),workId:fd.get('workId'),purpose:fd.get('purpose'),expression:fd.get('expression'),inputs:fd.get('inputs'),steps:fd.get('steps'),output:fd.get('output'),validation:fd.get('validation'),status:fd.get('status')};if(id)Object.assign(data.provenance.find(c=>c.id===id),obj);else{data.provenance.push(obj);data.links.push({from:obj.workId,to:obj.id,label:'calculation provenance'})}save()})}
function nodeTitle(id){return data.projects.find(x=>x.id===id)?.title||data.refs.find(x=>x.id===id)?.title||data.notes.find(x=>x.id===id)?.title||(data.provenance||[]).find(x=>x.id===id)?.title||(data.media||[]).find(x=>x.id===id)?.title||(data.sources||[]).find(x=>x.id===id)?.title||id}
function allNodes(){return [...data.projects.map(x=>({...x,type:'project'})),...data.refs.map(x=>({...x,type:'reference'})),...data.notes.map(x=>({...x,type:'note'})),...(data.provenance||[]).map(x=>({...x,type:'calculation'})),...(data.media||[]).map(x=>({...x,type:'media'})),...(data.sources||[]).map(x=>({...x,type:'source'}))]}
let currentMapFocus='';
function mapNeighborhood(focusId,maxDepth=2){if(!focusId)return new Set();const seen=new Set([focusId]);let frontier=[focusId];for(let depth=0;depth<maxDepth;depth++){const next=[];for(const id of frontier){for(const l of data.links){let other='';if(l.from===id)other=l.to;else if(l.to===id)other=l.from;if(other&&!seen.has(other)){seen.add(other);next.push(other)}}}frontier=next}const focusNode=allNodes().find(n=>n.id===focusId);if(focusNode?.type==='reference'){for(const n of allNodes()){if(n.workId===focusId)seen.add(n.id)}for(const s of (data.sources||[])){if(s.workId===focusId)seen.add(s.id)}}return seen}
function renderMap(focusId=''){currentMapFocus=focusId||'';const focused=!!currentMapFocus;$('#map').innerHTML=head('Knowledge Map',focused?'Focused branch view: related sources, files, calculations, notes, and research lineage are emphasized. Click the focused node again to open its full record.':'Click a node once to focus its research branch. Click the same node again to open the complete record.')+`<div class="card map-card"><div class="map-controls">${focused?'<button onclick="renderMap()">Show all</button>':'<button onclick="drawGraph()">Re-center</button>'}${focused?`<button onclick="openMapNode('${currentMapFocus}')">Open focused record</button>`:''}<button onclick="openLink()">+ Relationship</button></div><div class="legend"><b>${focused?'Focused branch':'Interactive map'}</b><br>${focused?'Bright = related to focus<br>Dim = outside this branch':'Click once = focus branch<br>Click again = open record'}<br><br>Large circle = project<br>Square = publication/work<br>Small circle = note / calculation / source</div><svg id="graph" viewBox="0 0 1000 650"></svg></div>`;drawGraph(currentMapFocus)}
function mapNodeClick(id){if(currentMapFocus===id)openMapNode(id);else renderMap(id)}
function drawGraph(focusId=''){const svg=$('#graph');if(!svg)return;const nodes=allNodes().filter(n=>!searchTerm||matches(n));const ids=new Set(nodes.map(n=>n.id));const links=data.links.filter(l=>ids.has(l.from)&&ids.has(l.to));const active=focusId?mapNeighborhood(focusId,2):new Set(ids);const cx=500,cy=325,pos={};const activeNodes=nodes.filter(n=>active.has(n.id));const inactiveNodes=nodes.filter(n=>!active.has(n.id));if(focusId&&ids.has(focusId))pos[focusId]={x:cx,y:cy};const rings=[activeNodes.filter(n=>n.id!==focusId&&data.links.some(l=>(l.from===focusId&&l.to===n.id)||(l.to===focusId&&l.from===n.id))),activeNodes.filter(n=>n.id!==focusId)];const directIds=new Set(rings[0].map(n=>n.id));const second=rings[1].filter(n=>!directIds.has(n.id));function place(arr,r,start=-Math.PI/2){arr.forEach((n,i)=>{const a=start+2*Math.PI*i/Math.max(arr.length,1);pos[n.id]={x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r}})}if(focusId){place(rings[0],155);place(second,255,Math.PI/2);place(inactiveNodes,315,-Math.PI/2)}else{const projects=nodes.filter(n=>n.type==='project'),others=nodes.filter(n=>n.type!=='project');place(projects,175);place(others,275)}let html='';links.forEach(l=>{const a=pos[l.from],b=pos[l.to];if(!a||!b)return;const isActive=!focusId||(active.has(l.from)&&active.has(l.to));html+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${isActive?'#5f79a5':'#263553'}" stroke-width="${isActive?2:1}" opacity="${isActive?0.9:0.15}"/>`;if(isActive)html+=`<text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2-5}" fill="#8fa4c4" font-size="9" text-anchor="middle" pointer-events="none">${esc(l.label)}</text>`});nodes.forEach(n=>{const p=pos[n.id];if(!p)return;const isActive=!focusId||active.has(n.id),isFocus=focusId===n.id,short=(n.title||'').length>30?(n.title||'').slice(0,27)+'…':n.title;const tip=esc((isFocus?'Click again to open: ':'Click to focus: ')+(n.title||''));const opacity=isActive?1:0.16;if(n.type==='reference'){html+=`<g class="graph-node ${isActive?'active-node':'dim-node'}" opacity="${opacity}" tabindex="0" role="button" aria-label="${tip}" onclick="mapNodeClick('${n.id}')" ondblclick="openMapNode('${n.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();mapNodeClick('${n.id}')}"><title>${tip}</title><rect x="${p.x-17}" y="${p.y-17}" width="34" height="34" rx="7" fill="${n.verified?'#22d3ee':'#7c3aed'}" stroke="${isFocus?'#ffffff':'#dbeafe'}" stroke-width="${isFocus?4:1}"/><text x="${p.x}" y="${p.y+36}" fill="#dbeafe" font-size="10" text-anchor="middle" pointer-events="none">${esc(short)}</text></g>`}else{const rr=n.type==='project'?19:10;html+=`<g class="graph-node ${isActive?'active-node':'dim-node'}" opacity="${opacity}" tabindex="0" role="button" aria-label="${tip}" onclick="mapNodeClick('${n.id}')" ondblclick="openMapNode('${n.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();mapNodeClick('${n.id}')}"><title>${tip}</title><circle cx="${p.x}" cy="${p.y}" r="${rr}" fill="${n.type==='project'?'#8b5cf6':'#334155'}" stroke="${isFocus?'#ffffff':'#dbeafe'}" stroke-width="${isFocus?4:1}"/><text x="${p.x}" y="${p.y+rr+16}" fill="#dbeafe" font-size="10" text-anchor="middle" pointer-events="none">${esc(short)}</text></g>`}});svg.innerHTML=html}
function openMapNode(id){const r=data.refs.find(x=>x.id===id);if(r)return openWork(id);const c=(data.provenance||[]).find(x=>x.id===id);if(c){showView('provenance');setTimeout(()=>{const cards=[...document.querySelectorAll('#provenance .calc-card')];const card=cards.find(el=>el.textContent.includes(c.title));if(card){card.scrollIntoView({behavior:'smooth',block:'center'});card.classList.add('map-highlight');setTimeout(()=>card.classList.remove('map-highlight'),1800)}},80);return}const m=(data.media||[]).find(x=>x.id===id);if(m){showView('media');setTimeout(()=>openMediaRecord(id),50);return}const s=(data.sources||[]).find(x=>x.id===id);if(s){showView('sourceIndex');setTimeout(()=>openSource(id),50);return}const n=data.notes.find(x=>x.id===id);if(n){showView('notes');setTimeout(()=>openNote(id),50);return}const p=data.projects.find(x=>x.id===id);if(p){showView('projects');setTimeout(()=>openProject(id),50)}}
function openWork(id){const r=data.refs.find(x=>x.id===id);if(!r)return;const calcs=(data.provenance||[]).filter(c=>c.workId===id);const media=(data.media||[]).filter(m=>m.workId===id);const sources=(data.sources||[]).filter(s=>s.workId===id);const notes=data.notes.filter(n=>n.projectId===r.projectId);const rels=data.links.filter(l=>l.from===id||l.to===id);const body=`<div class="work-record"><div class="work-kicker">${r.verified?'✓ VERIFIED WORK':'WORK RECORD'} · ${esc(r.resourceType||'Research work')}</div><h2>${esc(r.title)}</h2><div class="work-meta">${esc(projectName(r.projectId))} · ${esc(r.publishedDate||'Date not recorded')} · ${esc(r.version||'version not recorded')}</div>${r.doi?`<div class="work-doi"><b>DOI</b> ${r.url?`<a class="doi-link" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.doi)} ↗</a>`:esc(r.doi)}</div>`:''}<div class="work-section"><b>Finding / summary</b><p>${esc(r.summary||'No summary recorded.')}</p></div><div class="work-actions">${r.url?`<a class="work-button" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Open publication ↗</a>`:''}<button type="button" onclick="document.getElementById('modal').close();openRef('${r.id}')">Edit record</button><button type="button" onclick="document.getElementById('modal').close();focusMap('${r.id}')">Back to map</button></div><div class="work-section"><b>Math & calculations (${calcs.length})</b>${calcs.length?calcs.map(c=>`<button type="button" class="work-jump" onclick="document.getElementById('modal').close();openMapNode('${c.id}')"><span>${esc(c.kind)}</span>${esc(c.title)} →</button>`).join(''):'<p class="meta">No calculation objects linked yet.</p>'}</div><div class="work-section"><b>Research media & files (${media.length})</b>${media.length?media.map(m=>`<button type="button" class="work-jump" onclick="document.getElementById('modal').close();openMediaRecord('${m.id}')"><span>${esc(mediaIcon(m.mime))} ${esc(m.category||'Media')}</span>${esc(m.title)} →</button>`).join(''):'<p class="meta">No media linked to this work yet.</p>'}</div><div class="work-section"><b>Reference & provenance index (${sources.length})</b>${sources.length?sources.map(s=>`<button type="button" class="work-jump" onclick="document.getElementById('modal').close();openSource('${s.id}')"><span>${esc(s.sourceType||'Source')} · ${esc(s.provenanceStatus||'')}</span>${esc(s.title)} →</button>`).join(''):'<p class="meta">No indexed sources linked yet.</p>'}<button type="button" class="work-jump" onclick="document.getElementById('modal').close();openSource()"><span>Add</span>+ Add source to provenance index</button></div><div class="work-section"><b>Relationships (${rels.length})</b>${rels.length?rels.map(l=>`<div class="work-rel"><span>${esc(nodeTitle(l.from))}</span> <em>${esc(l.label)}</em> <span>→ ${esc(nodeTitle(l.to))}</span></div>`).join(''):'<p class="meta">No relationships recorded.</p>'}</div><div class="work-section"><b>Project notes (${notes.length})</b>${notes.length?notes.map(n=>`<button type="button" class="work-jump" onclick="document.getElementById('modal').close();openMapNode('${n.id}')">${esc(n.title)} →</button>`).join(''):'<p class="meta">No project notes recorded.</p>'}</div></div>`;openModal('Work record',body,null,true)}

function openProject(id){const x=data.projects.find(p=>p.id===id)||{title:'',description:'',status:'Active',keywords:[]};openModal(id?'Edit project':'New project',`<div class="form-grid"><label class="field full">Title<input name="title" value="${esc(x.title)}" required></label><label class="field">Status<input name="status" value="${esc(x.status)}"></label><label class="field">Keywords<input name="keywords" value="${esc((x.keywords||[]).join(', '))}"></label><label class="field full">Description<textarea name="description">${esc(x.description||'')}</textarea></label></div>`,fd=>{const obj={id:id||'p'+Date.now(),title:fd.get('title'),description:fd.get('description'),status:fd.get('status'),keywords:split(fd.get('keywords'))};if(id)Object.assign(data.projects.find(p=>p.id===id),obj);else data.projects.push(obj);save()})}

te:fd.get('publishedDate'),resourceType:fd.get('resourceType'),status:fd.get('status'),projectId:fd.get('projectId'),license:fd.get('license'),verified:fd.get('verified')==='true',keywords:split(fd.get('keywords')),summary:fd.get('summary')};if(id)Object.assign(data.refs.find(r=>r.id===id),obj);else{data.refs.push(obj);data.links.push({from:obj.projectId,to:obj.id,label:'publication'})}save()})}

const MEDIA_DB='omegaResearchAtlas.media.v1', MEDIA_STORE='blobs';
function mediaDB(){return new Promise((resolve,reject)=>{const q=indexedDB.open(MEDIA_DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(MEDIA_STORE))q.result.createObjectStore(MEDIA_STORE)};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function putMediaBlob(id,blob){const db=await mediaDB();return new Promise((resolve,reject)=>{const tx=db.transaction(MEDIA_STORE,'readwrite');tx.objectStore(MEDIA_STORE).put(blob,id);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
async function getMediaBlob(id){const db=await mediaDB();return new Promise((resolve,reject)=>{const q=db.transaction(MEDIA_STORE,'readonly').objectStore(MEDIA_STORE).get(id);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function removeMediaBlob(id){const db=await mediaDB();return new Promise((resolve,reject)=>{const tx=db.transaction(MEDIA_STORE,'readwrite');tx.objectStore(MEDIA_STORE).delete(id);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
function mediaIcon(mime=''){return mime.startsWith('audio/')?'🎙️':mime.startsWith('video/')?'🎥':mime.startsWith('image/')?'🖼️':mime.includes('pdf')?'📄':mime.includes('spreadsheet')||mime.includes('csv')?'📊':mime.includes('zip')?'🗜️':'📎'}
function mediaKind(mime=''){return mime.startsWith('audio/')?'Audio':mime.startsWith('video/')?'Video':mime.startsWith('image/')?'Image':mime.includes('pdf')?'PDF':mime.includes('spreadsheet')||mime.includes('csv')?'Data / spreadsheet':'File'}
function formatBytes(n=0){if(!n)return '0 B';const u=['B','KB','MB','GB'];let i=0,x=n;while(x>=1024&&i<u.length-1){x/=1024;i++}return `${x.toFixed(i?1:0)} ${u[i]}`}
function renderMedia(){data.media=data.media||[];data.sources=data.sources||[];const arr=data.media.filter(matches);$('#media').innerHTML=head('Research Media','Voice notes, video walkthroughs, images, source files, datasets, and method commentary linked directly to your research.','<div class="toolbar"><button onclick="chooseFiles()">+ Add files</button><button onclick="startAudioRecording()">🎙 Record audio</button></div>')+`<div id="mediaDrop" class="drop-zone" onclick="chooseFiles()"><b>Drop files here</b><span>Audio · video · PDF · spreadsheet · image · code · data</span><small>Files are stored locally in this browser using IndexedDB. JSON export contains their metadata, not the binary files.</small><input id="mediaFileInput" type="file" multiple hidden></div>`+(arr.length?`<div class="grid media-grid">${arr.map(m=>`<div class="card media-card"><div class="media-icon">${mediaIcon(m.mime)}</div><div class="meta">${esc(m.category||mediaKind(m.mime))} · ${esc(m.evidenceStatus||'Research log')}</div><h3>${esc(m.title)}</h3><div class="meta">${esc(projectName(m.projectId))}${m.workId?' · '+esc(workName(m.workId)):''}</div><p>${esc(m.description||'')}</p><div class="media-facts">${esc(m.name||'')} · ${formatBytes(m.size)} · ${esc(m.createdAt||'')}</div><div class="toolbar"><button onclick="openMediaRecord('${m.id}')">Open</button><button onclick="editMediaMeta('${m.id}')">Edit</button><button onclick="focusMap('${m.id}')">Map</button></div></div>`).join('')}</div>`:'<div class="empty">No media has been added yet.</div>');setupDropZone()}
function setupDropZone(){const z=$('#mediaDrop'),i=$('#mediaFileInput');if(!z||!i)return;i.onchange=e=>{if(e.target.files?.length)ingestFiles([...e.target.files]);i.value=''};['dragenter','dragover'].forEach(ev=>z.addEventListener(ev,e=>{e.preventDefault();z.classList.add('dragging')}));['dragleave','drop'].forEach(ev=>z.addEventListener(ev,e=>{e.preventDefault();z.classList.remove('dragging')}));z.addEventListener('drop',e=>{if(e.dataTransfer?.files?.length)ingestFiles([...e.dataTransfer.files])})}
function chooseFiles(){let i=$('#mediaFileInput');if(!i){showView('media');setTimeout(()=>$('#mediaFileInput')?.click(),50)}else i.click()}
function workOptions(projectId,selected=''){const rs=data.refs.filter(r=>!projectId||r.projectId===projectId);return `<option value="">Project-level / not tied to one work</option>`+rs.map(r=>`<option value="${r.id}" ${r.id===selected?'selected':''}>${esc(r.title)}</option>`).join('')}
function ingestFiles(files,defaults={}){if(!files.length)return;const f=files[0];openModal(files.length===1?'Add research file':`Add ${files.length} research files`,`<div class="form-grid"><label class="field full">Title<input name="title" value="${esc(defaults.title||f.name.replace(/\.[^.]+$/,''))}"></label><label class="field">Project<select name="projectId" id="mediaProjectSelect">${data.projects.map(p=>`<option value="${p.id}" ${p.id===(defaults.projectId||data.projects[0]?.id)?'selected':''}>${esc(p.title)}</option>`).join('')}</select></label><label class="field">Linked work<select name="workId" id="mediaWorkSelect">${workOptions(defaults.projectId||data.projects[0]?.id,defaults.workId||'')}</select></label><label class="field">Type / role<select name="category">${['Research log','Method explanation','Source data','Supporting document','Figure / image','Presentation / walkthrough','Evidence','Hypothesis / idea'].map(v=>`<option ${v===(defaults.category||'Research log')?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Evidence status<select name="evidenceStatus">${['Commentary / log','Exploratory','Source material','Supporting evidence','Validated evidence','Final result'].map(v=>`<option ${v===(defaults.evidenceStatus||'Commentary / log')?'selected':''}>${v}</option>`).join('')}</select></label><label class="field full">Description<textarea name="description">${esc(defaults.description||'')}</textarea></label><div class="field full"><div class="file-summary">${files.map(x=>`${mediaIcon(x.type)} ${esc(x.name)} · ${formatBytes(x.size)}`).join('<br>')}</div></div></div>`,async fd=>{for(let idx=0;idx<files.length;idx++){const file=files[idx],id='m'+Date.now()+idx;await putMediaBlob(id,file);const obj={id,title:files.length===1?(fd.get('title')||file.name):(file.name.replace(/\.[^.]+$/,'')),name:file.name,mime:file.type||'application/octet-stream',size:file.size,projectId:fd.get('projectId'),workId:fd.get('workId'),category:fd.get('category'),evidenceStatus:fd.get('evidenceStatus'),description:fd.get('description'),createdAt:new Date().toISOString().slice(0,19).replace('T',' ')};data.media.push(obj);data.links.push({from:obj.workId||obj.projectId,to:id,label:'media / source'})}save();showView('media')});setTimeout(()=>{const p=$('#mediaProjectSelect'),w=$('#mediaWorkSelect');if(p&&w)p.onchange=()=>w.innerHTML=workOptions(p.value,'')},30)}
async function openMediaRecord(id){const m=data.media.find(x=>x.id===id);if(!m)return;let blob;try{blob=await getMediaBlob(id)}catch{};let preview='<div class="missing-blob">The file bytes are not available in this browser. The metadata is still preserved.</div>';let url='';if(blob){url=URL.createObjectURL(blob);if(m.mime.startsWith('audio/'))preview=`<audio class="media-preview" controls src="${url}"></audio>`;else if(m.mime.startsWith('video/'))preview=`<video class="media-preview video" controls src="${url}"></video>`;else if(m.mime.startsWith('image/'))preview=`<img class="media-preview image" src="${url}" alt="${esc(m.title)}">`;else if(m.mime.includes('pdf'))preview=`<iframe class="media-preview pdf" src="${url}"></iframe>`;else preview=`<a class="work-button" href="${url}" target="_blank" rel="noopener">Open local file ↗</a>`}const body=`<div class="work-record"><div class="work-kicker">${mediaIcon(m.mime)} ${esc(m.category||mediaKind(m.mime))} · ${esc(m.evidenceStatus||'Research log')}</div><h2>${esc(m.title)}</h2><div class="work-meta">${esc(projectName(m.projectId))}${m.workId?' · '+esc(workName(m.workId)):''}</div>${preview}<div class="work-section"><b>Description</b><p>${esc(m.description||'No description recorded.')}</p></div><div class="work-section"><b>File provenance</b><p>${esc(m.name)} · ${formatBytes(m.size)}<br>Added ${esc(m.createdAt||'')}</p></div><div class="work-actions"><button type="button" onclick="document.getElementById('modal').close();editMediaMeta('${id}')">Edit metadata</button><button type="button" onclick="document.getElementById('modal').close();focusMap('${id}')">Show on map</button><button class="danger-inline" type="button" onclick="deleteMedia('${id}')">Delete</button></div></div>`;openModal('Research media',body,null,true);if(url)$('#modal').addEventListener('close',()=>URL.revokeObjectURL(url),{once:true})}
function editMediaMeta(id){const m=data.media.find(x=>x.id===id);if(!m)return;openModal('Edit media metadata',`<div class="form-grid"><label class="field full">Title<input name="title" value="${esc(m.title)}" required></label><label class="field">Project<select name="projectId" id="mediaProjectSelect">${data.projects.map(p=>`<option value="${p.id}" ${p.id===m.projectId?'selected':''}>${esc(p.title)}</option>`).join('')}</select></label><label class="field">Linked work<select name="workId" id="mediaWorkSelect">${workOptions(m.projectId,m.workId)}</select></label><label class="field">Type / role<input name="category" value="${esc(m.category||'Research log')}"></label><label class="field">Evidence status<input name="evidenceStatus" value="${esc(m.evidenceStatus||'Commentary / log')}"></label><label class="field full">Description<textarea name="description">${esc(m.description||'')}</textarea></label></div>`,fd=>{Object.assign(m,{title:fd.get('title'),projectId:fd.get('projectId'),workId:fd.get('workId'),category:fd.get('category'),evidenceStatus:fd.get('evidenceStatus'),description:fd.get('description')});data.links=data.links.filter(l=>l.to!==id||l.label!=='media / source');data.links.push({from:m.workId||m.projectId,to:id,label:'media / source'});save()});setTimeout(()=>{const p=$('#mediaProjectSelect'),w=$('#mediaWorkSelect');if(p&&w)p.onchange=()=>w.innerHTML=workOptions(p.value,'')},30)}
async function deleteMedia(id){if(!confirm('Delete this media record and its locally stored file?'))return;await removeMediaBlob(id).catch(()=>{});data.media=data.media.filter(m=>m.id!==id);data.links=data.links.filter(l=>l.from!==id&&l.to!==id);document.getElementById('modal')?.close();save();showView('media')}
let activeRecorder=null, activeStream=null, recorderChunks=[];
async function startAudioRecording(){if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){alert('Direct recording is not available in this browser context. You can still add a Voice Memos or audio file with “Add files.”');showView('media');return}try{activeStream=await navigator.mediaDevices.getUserMedia({audio:true});recorderChunks=[];activeRecorder=new MediaRecorder(activeStream);activeRecorder.ondataavailable=e=>{if(e.data.size)recorderChunks.push(e.data)};activeRecorder.onstop=()=>{const mime=activeRecorder.mimeType||'audio/webm';const ext=mime.includes('mp4')?'m4a':mime.includes('ogg')?'ogg':'webm';const blob=new Blob(recorderChunks,{type:mime});activeStream?.getTracks().forEach(t=>t.stop());activeStream=null;const file=new File([blob],`voice-note-${new Date().toISOString().replace(/[:.]/g,'-')}.${ext}`,{type:mime});document.getElementById('modal')?.close();setTimeout(()=>ingestFiles([file],{category:'Research log',evidenceStatus:'Commentary / log',title:'Voice research log'}),80)};activeRecorder.start();openModal('Recording voice note',`<div class="recorder"><div class="record-dot"></div><h3>Recording…</h3><p>Capture the observation, hypothesis, decision, or method explanation in your own words.</p><button type="button" class="record-stop" onclick="stopAudioRecording()">■ Stop & save recording</button><p class="meta">This recording is commentary until you explicitly classify it otherwise.</p></div>`,null,true);$('#modal').addEventListener('close',()=>{if(activeRecorder&&activeRecorder.state==='recording')cancelAudioRecording()},{once:true})}catch(err){alert('Microphone access was not available. You can record in Voice Memos and add the audio file here instead.')}}
function stopAudioRecording(){if(activeRecorder?.state==='recording')activeRecorder.stop()}
function cancelAudioRecording(){if(activeRecorder?.state==='recording'){activeRecorder.onstop=null;activeRecorder.stop()}activeStream?.getTracks().forEach(t=>t.stop());activeStream=null;activeRecorder=null;recorderChunks=[]}

function openLink(){const nodes=allNodes();openModal('New relationship',`<div class="form-grid"><label class="field">From<select name="from">${nodes.map(n=>`<option value="${n.id}">${esc(n.title)}</option>`).join('')}</select></label><label class="field">To<select name="to">${nodes.map(n=>`<option value="${n.id}">${esc(n.title)}</option>`).join('')}</select></label><label class="field full">Relationship<input name="label" placeholder="motivated / extends / uses data from / supports" required></label></div>`,fd=>{data.links.push({from:fd.get('from'),to:fd.get('to'),label:fd.get('label')});save()})}
function split(v){return String(v||'').split(',').map(x=>x.trim()).filter(Boolean)}
render();



// v1.0 mobile navigation helpers
(function(){
  function closeMobileNav(){
    const sb=document.querySelector('.sidebar'), ov=document.getElementById('sidebarOverlay');
    if(sb) sb.classList.remove('mobile-open');
    if(ov) ov.classList.remove('show');
  }
  function openMobileNav(){
    const sb=document.querySelector('.sidebar'), ov=document.getElementById('sidebarOverlay');
    if(sb) sb.classList.add('mobile-open');
    if(ov) ov.classList.add('show');
  }
  document.addEventListener('DOMContentLoaded',()=>{
    const b=document.getElementById('mobileMenuBtn'), ov=document.getElementById('sidebarOverlay');
    if(b) b.addEventListener('click',()=>document.querySelector('.sidebar')?.classList.contains('mobile-open')?closeMobileNav():openMobileNav());
    if(ov) ov.addEventListener('click',closeMobileNav);
    document.querySelectorAll('.nav-btn').forEach(x=>x.addEventListener('click',closeMobileNav));
    window.addEventListener('resize',()=>{if(innerWidth>900) closeMobileNav()});
  });
})();
